[package]
name = "native-asr-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
crossterm = "=0.29.0"
nix = { version = "=0.30.1", features = ["fs", "process", "signal", "term"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[dev-dependencies]
tempfile = "=3.23.0"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = "deny"
pedantic = "allow"
